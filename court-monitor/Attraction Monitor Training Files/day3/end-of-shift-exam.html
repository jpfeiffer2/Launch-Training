coration:none}.primary{background:var(--g);color:#071207}.yellow{background:var(--y);color:#000}.dark2{background:#111820;color:#fff}.result{padding:18px;margin-top:18px;display:none}.pass{background:#edf9ee;border-color:#89c997}.fail{background:#fff1f1;border-color:#e3a1a1}.review{margin-top:16px;display:grid;gap:8px}.wrong{border-left:6px solid #dc2626;background:#fff7f7;padding:10px;border-radius:8px}@media(max-width:760px){.meta-grid{grid-template-columns:1fr}.header{display:block}.header h1{white-space:normal}.source-pill{display:block;margin:8px 0 0;width:max-content}}</style>  <style>html{display:none}html.portal-authenticated{display:block}</style>
  <script>
    (() => {
      const storageKey = "launchTrainingUnlockedUntil";
      const unlockedUntil = Number(localStorage.getItem(storageKey) || 0);
      if (unlockedUntil <= Date.now()) {
        localStorage.removeItem(storageKey);
        const currentPath = window.location.pathname;
        const moduleMarker = "/court-monitor/";
        const modulePosition = currentPath.indexOf(moduleMarker);
        const portalBase = modulePosition >= 0 ? currentPath.slice(0, modulePosition + 1) : "/";
        const returnPath = currentPath + window.location.search + window.location.hash;
        window.location.replace(portalBase + "?return=" + encodeURIComponent(returnPath));

</head><body><div class="page-shell"><div class="container"><div class="brand-topbar"></div><div class="header"><h1>Final Attraction Monitor Training Exam</h1><p>50 randomized questions · randomized answer order</p></div><div class="content"><div class="exam-note"><strong>Exam build:</strong> 10 random Day 1 questions, 10 random Day 2 questions, and all 30 Day 3 questions. Questions and answers reshuffle each time the exam starts.</div><div class="meta-card"><div class="meta-grid"><div class="field"><label>Employee Name</label><input id="employee" / required></div><div class="field"><label>Trainer Name</label><input id="trainer" /></div><div class="field"><label>Park Location</label><input id="park" / required></div></div></div><div class="toolbar"><div class="progress-box" id="progress">Question 1</div><div><a class="button dark2" href="./index.html">Back to Day Menu</a><a class="button dark2" href="../../../index.html">Training Portal</a></div></div><form id="exam"></form><div class="actions"><button class="dark2" id="prev" type="button">Back</button><button class="primary" id="next" type="button">Next</button><button class="yellow" id="submit" type="button" style="display:none">Submit Exam</button></div><div class="result" id="result"></div></div></div></div>

<script>
function shuffle(a){let x=[...a];for(let i=x.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function sample(arr,n){return shuffle(arr).slice(0,n)}
function normalizeQuestion(q,source){return{source:source,id:q.id||'',category:q.category||source,question:q.question,answers:[...q.answers],correct:q.correct}}
function randomizeAnswers(q){const opts=q.answers.map((text,index)=>({text,correct:index===q.correct}));const mixed=shuffle(opts);return{...q,answers:mixed.map(o=>o.text),correct:mixed.findIndex(o=>o.correct)}}
function buildQuestionSet(){const d1=(window.DAY1_QUESTION_BANK||[]).map(q=>normalizeQuestion(q,'Day 1'));const d2=(window.DAY2_QUESTION_BANK||[]).map(q=>normalizeQuestion(q,'Day 2'));const d3=(window.DAY3_QUESTION_BANK||[]).map(q=>normalizeQuestion(q,'Day 3'));if(d1.length<10||d2.length<10||d3.length<30){alert('Question bank error: final exam requires at least 10 Day 1 questions, 10 Day 2 questions, and 30 Day 3 questions.');}
  const selected=[...sample(d1,10),...sample(d2,10),...d3];return shuffle(selected.map(randomizeAnswers));}
function escapeHtml(value){return String(value).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
const QUESTIONS=buildQuestionSet();let idx=0;const answers={};const form=document.getElementById('exam'),progress=document.getElementById('progress');
function render(){const q=QUESTIONS[idx];progress.innerHTML=`Question ${idx+1} of ${QUESTIONS.length}<span class="source-pill">${escapeHtml(q.source)}</span>`;form.innerHTML=`<div class="question-card"><div class="question-text">${idx+1}. ${escapeHtml(q.question)}</div><div class="answers">${q.answers.map((a,i)=>`<label class="answer"><input type="radio" name="q" value="${i}" ${answers[idx]===i?'checked':''}> <strong>${String.fromCharCode(65+i)}.</strong> <span>${escapeHtml(a)}</span></label>`).join('')}</div></div>`;form.querySelectorAll('input').forEach(inp=>inp.onchange=()=>answers[idx]=Number(inp.value));document.getElementById('prev').disabled=idx===0;document.getElementById('next').style.display=idx===QUESTIONS.length-1?'none':'inline-block';document.getElementById('submit').style.display=idx===QUESTIONS.length-1?'inline-block':'none'}
document.getElementById('prev').onclick=()=>{if(idx>0){idx--;render()}};document.getElementById('next').onclick=()=>{if(answers[idx]===undefined){alert('Please select an answer before continuing.');return}if(idx<QUESTIONS.length-1){idx++;render()}};
document.getElementById('submit').onclick=()=>{  const launchRequiredExamInfo=[{el:employee,label:'Employee Name'},{el:park,label:'Park Location'}];
  for(const item of launchRequiredExamInfo){
    if(!item.el || !item.el.value.trim()){
      alert('Please enter '+item.label+' before submitting.');
      if(item.el && item.el.focus) item.el.focus();
      return;
    }
  }
if(answers[idx]===undefined){alert('Please select an answer before submitting.');return}let correct=0,review=[];QUESTIONS.forEach((q,i)=>{if(answers[i]===q.correct) correct++; else review.push(`<div class="wrong"><strong>Question ${i+1} (${escapeHtml(q.source)}):</strong> ${escapeHtml(q.question)}<br>Your answer: ${escapeHtml(q.answers[answers[i]]||'No answer')}<br>Correct answer: ${escapeHtml(q.answers[q.correct])}</div>`)});let score=Math.round(correct/QUESTIONS.length*100);let pass=score>=80;let rec={date:new Date().toLocaleString(),employee:employee.value,trainer:trainer.value,park:park.value,day:'final',score,correct,total:QUESTIONS.length};let key='courtMonitorExamRecords';let records=JSON.parse(localStorage.getItem(key)||'[]');records.push(rec);localStorage.setItem(key,JSON.stringify(records));
  launchTrainingSubmitExamRecord({
    name: employee.value,
    parkLocation: park.value,
    trainingProgram: 'Court Monitor',
    examDay: 'Day 3 Exam',
    score: `${correct}/${QUESTIONS.length}`,
    percentage: `${score}%`,
    missedQuestions: review.length ? review.map(item => item.replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim()).join(' | ') : 'None'
  });const r=document.getElementById('result');r.className='result result-certificate launch-standard-certificate '+(pass?'pass':'fail');r.style.display='block';r.innerHTML = window.launchRenderStandardExamCertificate({
    status: pass ? 'PASS' : 'NEEDS REVIEW',
    trainingTitle: 'DAY 3 COURT MONITOR TRAINING',
    statementTitle: 'Day 3 Court Monitor Training',
    employeeName: employee.value,
    parkLocation: park.value,
    date: new Date().toLocaleDateString(),
    trainerName: trainer.value,
    scoreText: correct + ' / ' + QUESTIONS.length,
    percentText: score + '%',
    passed: pass,
    passingPercent: 80,
    missedHtml: review.length ? '<h3 style="margin:16px 0 8px">Missed Questions</h3>' + review.join('') : '<p style="padding:14px 0"><strong>&#10003; Perfect score — no missed questions.</strong></p>',
    recordsHref: './exam-records.html'
  });window.scrollTo(0,document.body.scrollHeight)};render();
</script>
<script id="launch-google-sheets-exam-records">
(function() {
  if (window.launchTrainingSubmitExamRecord) return;

  const ENDPOINT = "https://script.google.com/macros/s/AKfycbzKjtjFU8msyHtWcK7ziV3ewSvQcW5AKcVtEAkAjMSe0srGBheWSUA7XLrLTR8inYyo-w/exec";
  const SECRET = "JonathanPfeiffer";

  function clean(value) {
    return String(value == null ? '' : value).trim();
  }

  window.launchTrainingSubmitExamRecord = function(payload) {
    try {
      const record = Object.assign({}, payload || {});
      record.secret = SECRET;
      record.name = clean(record.name);
      record.parkLocation = clean(record.parkLocation);
      record.trainingProgram = clean(record.trainingProgram);
      record.examDay = clean(record.examDay);
      record.score = clean(record.score);
      record.percentage = clean(record.percentage);
      record.missedQuestions = clean(record.missedQuestions || 'None') || 'None';

      fetch(ENDPOINT, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(record),
        keepalive: true
      }).catch(function(error) {
        console.warn('Google Sheets exam record submission failed.', error);
      });
    } catch (error) {
      console.warn('Google Sheets exam record submission could not be prepared.', error);
    }
  };
})();
</script>


<script id="launch-standard-certificate-script">
(function () {
  if (window.launchRenderStandardExamCertificate) return;

  function escapeHtml(value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, function (char) {
      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[char];
    });
  }

  window.launchEscapeHtml = escapeHtml;

  window.launchRenderStandardExamCertificate = function (data) {
    data = data || {};

    const passed = !!data.passed;
    const stampText = data.status || (passed ? "PASS" : "FAIL");
    const stampClass = passed ? "stamp-pass" : "stamp-fail";
    const employeeName = data.employeeName || "—";
    const parkLocation = data.parkLocation || "—";
    const dateText = data.date || new Date().toLocaleDateString();
    const trainerName = data.trainerName || "—";
    const scoreText = data.scoreText || "—";
    const percentText = data.percentText || "—";
    const trainingTitle = data.trainingTitle || "TRAINING ASSESSMENT";
    const passingPercent = data.passingPercent || 80;

    const statement = passed
      ? `<strong>${escapeHtml(employeeName)}</strong> has successfully completed the Launch Family Entertainment ${escapeHtml(data.statementTitle || trainingTitle)} assessment with a score of <strong>${escapeHtml(scoreText)} (${escapeHtml(percentText)})</strong>. Passing threshold: ${passingPercent}%.`
      : `<strong>${escapeHtml(employeeName)}</strong> completed the Launch Family Entertainment ${escapeHtml(data.statementTitle || trainingTitle)} assessment with a score of <strong>${escapeHtml(scoreText)} (${escapeHtml(percentText)})</strong> — below the ${passingPercent}% passing threshold. Please review missed questions below and retest.`;

    const missedHtml = data.missedHtml || '<p style="padding:14px 0"><strong>&#10003; Perfect score — no missed questions.</strong></p>';
    const recordsLink = data.recordsHref
      ? `<a href="${escapeHtml(data.recordsHref)}">View Exam Records</a>`
      : "";

    return `
      <div class="cert-header">
        <div class="cert-header-left">
          <div class="cert-org">LAUNCH FAMILY ENTERTAINMENT</div>
          <div class="cert-title-line">${escapeHtml(trainingTitle)}</div>
          <div class="cert-subtitle">Training Assessment Record</div>
        </div>
        <div class="cert-stamp ${stampClass}">${escapeHtml(stampText)}</div>
      </div>

      <div class="cert-info-row">
        <div class="cert-info-field">
          <span class="cert-info-label">Employee Name</span>
          <span class="cert-info-value">${escapeHtml(employeeName)}</span>
        </div>
        <div class="cert-info-field">
          <span class="cert-info-label">Park Location</span>
          <span class="cert-info-value">${escapeHtml(parkLocation)}</span>
        </div>
        <div class="cert-info-field">
          <span class="cert-info-label">Date</span>
          <span class="cert-info-value">${escapeHtml(dateText)}</span>
        </div>
        <div class="cert-info-field">
          <span class="cert-info-label">Trainer / Manager</span>
          <span class="cert-info-value">${escapeHtml(trainerName)}</span>
        </div>
        <div class="cert-info-field cert-score-field">
          <span class="cert-info-label">Score</span>
          <span class="cert-info-value cert-score-value">${escapeHtml(scoreText)}</span>
        </div>
        <div class="cert-info-field">
          <span class="cert-info-label">Percentage</span>
          <span class="cert-info-value">${escapeHtml(percentText)}</span>
        </div>
      </div>

      <div class="cert-statement">${statement}</div>
      <div class="missed cert-missed">${missedHtml}</div>

      <div class="cert-sig-row">
        <div class="cert-sig-block">
          <div class="cert-sig-line"></div>
          <div class="cert-sig-label">Trainer / Manager Signature</div>
        </div>
        <div class="cert-sig-block">
          <div class="cert-sig-line"></div>
          <div class="cert-sig-label">Employee Signature</div>
        </div>
      </div>

      <div class="cert-actions no-print">
        <button type="button" onclick="window.print()">&#128438; Print / Save as PDF</button>
        ${recordsLink}
      </div>
    `;
  };
})();
</script>
