      if (unlockedUntil <= Date.now()) {
        localStorage.removeItem(storageKey);
        const currentPath = window.location.pathname;
        const moduleMarker = "/court-monitor/";

<script>
function shuffle(items){
  const copy=[...items];
  for(let i=copy.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [copy[i],copy[j]]=[copy[j],copy[i]];
  }
  return copy;
}
function escapeHtml(value){
  return String(value).replace(/[&<>'"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[ch]));
}
if(!Array.isArray(window.DAY1_QUESTION_BANK)||window.DAY1_QUESTION_BANK.length!==30){
  document.body.innerHTML='<div style="font-family:Arial;padding:30px"><h1>Question bank error</h1><p>The Day 1 question bank could not be loaded.</p></div>';
  throw new Error('Day 1 question bank missing or does not contain 30 questions.');
}
const QUESTIONS=shuffle(window.DAY1_QUESTION_BANK).map(source=>{
  const options=shuffle(source.answers.map((text,index)=>({text,isCorrect:index===source.correct})));
  return {...source,options,correctIndex:options.findIndex(option=>option.isCorrect)};
});
const responses={};
const form=document.getElementById('exam');
const answered=document.getElementById('answered');
function updateAnswered(){
  answered.textContent=`${Object.keys(responses).length} of ${QUESTIONS.length} answered`;
}
function renderAll(){
  form.innerHTML=QUESTIONS.map((q,index)=>`<div class="question-card" id="question-${index}"><div class="question-text">${index+1}. ${escapeHtml(q.question)}</div><div class="answers">${q.options.map((option,i)=>`<label class="answer ${responses[index]===i?'selected':''}"><input type="radio" name="q${index}" value="${i}" ${responses[index]===i?'checked':''}> <strong>${String.fromCharCode(65+i)}.</strong> <span>${escapeHtml(option.text)}</span></label>`).join('')}</div></div>`).join('');
  form.querySelectorAll('input[type="radio"]').forEach(input=>input.addEventListener('change',()=>{
    const questionIndex=Number(input.name.slice(1));
    responses[questionIndex]=Number(input.value);
    const card=document.getElementById(`question-${questionIndex}`);
    card.classList.remove('unanswered');
    card.querySelectorAll('.answer').forEach(label=>label.classList.remove('selected'));
    input.closest('.answer').classList.add('selected');
    updateAnswered();
  }));
  updateAnswered();
}
document.getElementById('submit').addEventListener('click',()=>{
  const launchRequiredExamInfo=[{el:employee,label:'Employee Name'},{el:park,label:'Park Location'}];
  for(const item of launchRequiredExamInfo){
    if(!item.el || !item.el.value.trim()){
      alert('Please enter '+item.label+' before submitting.');
      if(item.el && item.el.focus) item.el.focus();
      return;
    }
  }
  const missing=QUESTIONS.map((_,i)=>i).filter(i=>responses[i]===undefined);
  document.querySelectorAll('.question-card').forEach(card=>card.classList.remove('unanswered'));
  if(missing.length){
    missing.forEach(i=>document.getElementById(`question-${i}`).classList.add('unanswered'));
    alert(`Please answer all questions before submitting. ${missing.length} question${missing.length===1?' is':'s are'} still unanswered.`);
    document.getElementById(`question-${missing[0]}`).scrollIntoView({behavior:'smooth',block:'start'});
    return;
  }
  let correct=0;
  const review=[];
  const details=[];
  QUESTIONS.forEach((q,i)=>{
    const selected=responses[i];
    const isCorrect=selected===q.correctIndex;
    if(isCorrect) correct++;
    else review.push(`<div class="wrong"><strong>Question ${i+1}:</strong> ${escapeHtml(q.question)}<br>Your answer: ${escapeHtml(q.options[selected]?.text||'No answer')}<br>Correct answer: ${escapeHtml(q.options[q.correctIndex].text)}</div>`);
    details.push({
      id:q.id,
      category:q.category,
      question:q.question,
      selectedAnswer:q.options[selected]?.text||'',
      correctAnswer:q.options[q.correctIndex].text,
      isCorrect
    });
  });
  const score=Math.round(correct/QUESTIONS.length*100);
  const pass=score>=80;
  const rec={date:new Date().toLocaleString(),employee:employee.value,trainer:trainer.value,park:park.value,day:'day1',score,correct,total:QUESTIONS.length,responses:details};
  const key='courtMonitorExamRecords';
  const records=JSON.parse(localStorage.getItem(key)||'[]');
  records.push(rec);
  localStorage.setItem(key,JSON.stringify(records));
  launchTrainingSubmitExamRecord({
    name: employee.value,
    parkLocation: park.value,
    trainingProgram: 'Court Monitor',
    examDay: 'Day 1 Exam',
    score: `${correct}/${QUESTIONS.length}`,
    percentage: `${score}%`,
    missedQuestions: details.filter(d => !d.isCorrect).map((d, index) => `Q${details.indexOf(d) + 1}: ${d.question} | Correct: ${d.correctAnswer}`).join(' | ') || 'None'
  });
  const result=document.getElementById('result');
  result.className='result result-certificate launch-standard-certificate '+(pass?'pass':'fail');
  result.style.display='block';
  result.innerHTML = window.launchRenderStandardExamCertificate({
    status: pass ? 'PASS' : 'NEEDS REVIEW',
    trainingTitle: 'DAY 1 COURT MONITOR TRAINING',
    statementTitle: 'Day 1 Court Monitor Training',
    employeeName: employee.value,
    parkLocation: park.value,
    date: new Date().toLocaleDateString(),
    trainerName: trainer.value,
    scoreText: correct + ' / ' + QUESTIONS.length,
    percentText: score + '%',
    passed: pass,
    passingPercent: 80,
    missedHtml: review.length ? '<h3 style="margin:16px 0 8px">Missed Questions</h3>' + review.join('') : '<p style="padding:14px 0"><strong>&#10003; Perfect score — no missed questions.</strong></p>',
    recordsHref: './exam-records.html'
  });
  result.scrollIntoView({behavior:'smooth',block:'start'});
});
renderAll();
</script>

<script id="launch-google-sheets-exam-records">
(function() {
  if (window.launchTrainingSubmitExamRecord) return;

  const ENDPOINT = "https://script.google.com/macros/s/AKfycbzKjtjFU8msyHtWcK7ziV3ewSvQcW5AKcVtEAkAjMSe0srGBheWSUA7XLrLTR8inYyo-w/exec";
  const SECRET = "JonathanPfeiffer";

  function clean(value) {
    return String(value == null ? '' : value).trim();
  }

  window.launchTrainingSubmitExamRecord = function(payload) {
    try {
      const record = Object.assign({}, payload || {});
      record.secret = SECRET;
      record.name = clean(record.name);
      record.parkLocation = clean(record.parkLocation);
      record.trainingProgram = clean(record.trainingProgram);
      record.examDay = clean(record.examDay);
      record.score = clean(record.score);
      record.percentage = clean(record.percentage);
      record.missedQuestions = clean(record.missedQuestions || 'None') || 'None';

      fetch(ENDPOINT, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(record),
        keepalive: true
      }).catch(function(error) {
        console.warn('Google Sheets exam record submission failed.', error);
      });
    } catch (error) {
      console.warn('Google Sheets exam record submission could not be prepared.', error);
    }
  };
})();
</script>


<script id="launch-standard-certificate-script">
(function () {
  if (window.launchRenderStandardExamCertificate) return;

  function escapeHtml(value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, function (char) {
      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[char];
    });
  }

  window.launchEscapeHtml = escapeHtml;

  window.launchRenderStandardExamCertificate = function (data) {
    data = data || {};

    const passed = !!data.passed;
    const stampText = data.status || (passed ? "PASS" : "FAIL");
    const stampClass = passed ? "stamp-pass" : "stamp-fail";
    const employeeName = data.employeeName || "—";
    const parkLocation = data.parkLocation || "—";
    const dateText = data.date || new Date().toLocaleDateString();
    const trainerName = data.trainerName || "—";
    const scoreText = data.scoreText || "—";
    const percentText = data.percentText || "—";
    const trainingTitle = data.trainingTitle || "TRAINING ASSESSMENT";
    const passingPercent = data.passingPercent || 80;

    const statement = passed
      ? `<strong>${escapeHtml(employeeName)}</strong> has successfully completed the Launch Family Entertainment ${escapeHtml(data.statementTitle || trainingTitle)} assessment with a score of <strong>${escapeHtml(scoreText)} (${escapeHtml(percentText)})</strong>. Passing threshold: ${passingPercent}%.`
      : `<strong>${escapeHtml(employeeName)}</strong> completed the Launch Family Entertainment ${escapeHtml(data.statementTitle || trainingTitle)} assessment with a score of <strong>${escapeHtml(scoreText)} (${escapeHtml(percentText)})</strong> — below the ${passingPercent}% passing threshold. Please review missed questions below and retest.`;

    const missedHtml = data.missedHtml || '<p style="padding:14px 0"><strong>&#10003; Perfect score — no missed questions.</strong></p>';
    const recordsLink = data.recordsHref
      ? `<a href="${escapeHtml(data.recordsHref)}">View Exam Records</a>`
      : "";

    return `
      <div class="cert-header">
        <div class="cert-header-left">
          <div class="cert-org">LAUNCH FAMILY ENTERTAINMENT</div>
          <div class="cert-title-line">${escapeHtml(trainingTitle)}</div>
          <div class="cert-subtitle">Training Assessment Record</div>
        </div>
        <div class="cert-stamp ${stampClass}">${escapeHtml(stampText)}</div>
      </div>

      <div class="cert-info-row">
        <div class="cert-info-field">
          <span class="cert-info-label">Employee Name</span>
          <span class="cert-info-value">${escapeHtml(employeeName)}</span>
        </div>
        <div class="cert-info-field">
          <span class="cert-info-label">Park Location</span>
          <span class="cert-info-value">${escapeHtml(parkLocation)}</span>
        </div>
        <div class="cert-info-field">
          <span class="cert-info-label">Date</span>
          <span class="cert-info-value">${escapeHtml(dateText)}</span>
        </div>
        <div class="cert-info-field">
          <span class="cert-info-label">Trainer / Manager</span>
          <span class="cert-info-value">${escapeHtml(trainerName)}</span>
        </div>
        <div class="cert-info-field cert-score-field">
          <span class="cert-info-label">Score</span>
          <span class="cert-info-value cert-score-value">${escapeHtml(scoreText)}</span>
        </div>
        <div class="cert-info-field">
          <span class="cert-info-label">Percentage</span>
          <span class="cert-info-value">${escapeHtml(percentText)}</span>
        </div>
      </div>

      <div class="cert-statement">${statement}</div>
      <div class="missed cert-missed">${missedHtml}</div>

      <div class="cert-sig-row">
        <div class="cert-sig-block">
          <div class="cert-sig-line"></div>
          <div class="cert-sig-label">Trainer / Manager Signature</div>
        </div>
        <div class="cert-sig-block">
          <div class="cert-sig-line"></div>
          <div class="cert-sig-label">Employee Signature</div>
        </div>
      </div>

      <div class="cert-actions no-print">
        <button type="button" onclick="window.print()">&#128438; Print / Save as PDF</button>
        ${recordsLink}
      </div>
    `;
  };
})();
</script>

</body>
</html>
